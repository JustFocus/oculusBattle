[package]
name = "artgen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Renders the game's art sources (art/*.svg and the procedural map) into assets/."

[dependencies]
resvg = "0.50"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
